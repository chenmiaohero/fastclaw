# Let's Encrypt ClusterIssuer (需要先安装 cert-manager)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: your-email@example.com  # 替换为你的邮箱
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx

---
# 主域名 Ingress (workany.ai)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workany-main
  namespace: workany
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  tls:
  - hosts:
    - workany.ai
    secretName: workany-ai-tls
  rules:
  - host: workany.ai
    http:
      paths:
      # Bot API 路由到 clawork
      - path: /bot/api
        pathType: Prefix
        backend:
          service:
            name: clawork
            port:
              number: 18080
      # 其他路由到 workany 前端 (需要单独部署)
      - path: /
        pathType: Prefix
        backend:
          service:
            name: workany  # 你的前端服务
            port:
              number: 80

---
# Bot 子域名 Ingress (*.workany.bot)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workany-bot
  namespace: workany
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # WebSocket 支持
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/upstream-hash-by: "$host"
    # WebSocket headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
spec:
  tls:
  - hosts:
    - "*.workany.bot"
    secretName: workany-bot-wildcard-tls
  rules:
  - host: "*.workany.bot"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: clawork
            port:
              number: 18080
