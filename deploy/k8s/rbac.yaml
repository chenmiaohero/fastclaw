apiVersion: v1
kind: ServiceAccount
metadata:
  name: fastclaw
  namespace: fastclaw
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fastclaw
  namespace: fastclaw
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/exec", "pods/log", "services", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fastclaw
  namespace: fastclaw
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fastclaw
subjects:
  - kind: ServiceAccount
    name: fastclaw
    namespace: fastclaw
