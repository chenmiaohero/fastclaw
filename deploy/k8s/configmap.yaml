apiVersion: v1
kind: ConfigMap
metadata:
  name: fastclaw-config
  namespace: fastclaw
data:
  config.toml: |
    [server]
    port = 18080

    [db]
    host = "fastclaw-pg"
    port = 5432
    user = "postgres"
    password = ""
    database = "fastclaw"
    sslmode = "disable"
    timezone = "Asia/Shanghai"

    [kubernetes]
    kubeconfig = ""
    namespace = "fastclaw"

    [storage]
    pvc_name = "fastclaw-shared-data"
    base_path = "/fastclaw-data"

    [domain]
    api_domain = "fastclaw.ai"
    bot_domain_suffix = "fastclaw.ai"
    bot_domain_template = "https://{bot_id}.fastclaw.ai"

    [openclaw]
    image = "1panel/openclaw:latest"
    gateway_port = 18789
    cpu_limit = "2000m"
    memory_limit = "4Gi"
    cpu_request = "500m"
    memory_request = "1Gi"
