apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fastclaw-pg-data
  namespace: fastclaw
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastclaw-pg
  namespace: fastclaw
  labels:
    app: fastclaw-pg
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fastclaw-pg
  template:
    metadata:
      labels:
        app: fastclaw-pg
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: fastclaw
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fastclaw-secrets
                  key: db-password
          volumeMounts:
            - name: pg-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: pg-data
          persistentVolumeClaim:
            claimName: fastclaw-pg-data
---
apiVersion: v1
kind: Service
metadata:
  name: fastclaw-pg
  namespace: fastclaw
spec:
  selector:
    app: fastclaw-pg
  ports:
    - port: 5432
      targetPort: 5432
