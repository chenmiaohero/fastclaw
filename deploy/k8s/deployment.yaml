apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawhost
  namespace: clawhost
  labels:
    app: clawhost
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clawhost
  template:
    metadata:
      labels:
        app: clawhost
    spec:
      serviceAccountName: clawhost
      containers:
        - name: clawhost
          image: clawhost:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 18080
          env:
            - name: CLAWHOST_API_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: clawhost-secrets
                  key: admin-token
            - name: CLAWHOST_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clawhost-secrets
                  key: db-password
          volumeMounts:
            - name: config
              mountPath: /app/config.toml
              subPath: config.toml
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 18080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 18080
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: clawhost-config
---
apiVersion: v1
kind: Service
metadata:
  name: clawhost
  namespace: clawhost
spec:
  selector:
    app: clawhost
  ports:
    - port: 18080
      targetPort: 18080
