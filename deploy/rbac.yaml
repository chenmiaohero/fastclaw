# ServiceAccount for clawork
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clawork
  namespace: workany

---
# Role with permissions to manage Bot Pods
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clawork-role
  namespace: workany
rules:
# Deployment 管理权限
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Service 管理权限
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# Pod 查看和执行权限 (用于写入配置和执行命令)
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "delete"]

- apiGroups: [""]
  resources: ["pods/exec"]
  verbs: ["create"]

# Pod 日志查看权限
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]

---
# Bind Role to ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clawork-binding
  namespace: workany
subjects:
- kind: ServiceAccount
  name: clawork
  namespace: workany
roleRef:
  kind: Role
  name: clawork-role
  apiGroup: rbac.authorization.k8s.io
