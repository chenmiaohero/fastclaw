apiVersion: apps/v1
kind: Deployment
metadata:
  name: clawork
  namespace: workany
  labels:
    app: clawork
spec:
  replicas: 2
  selector:
    matchLabels:
      app: clawork
  template:
    metadata:
      labels:
        app: clawork
    spec:
      serviceAccountName: clawork
      containers:
      - name: clawork
        image: your-registry/clawork:latest  # 替换为你的镜像地址
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 18080
          protocol: TCP
        command: ["./clawork", "server"]
        volumeMounts:
        - name: config
          mountPath: /app/config.toml
          subPath: config.toml
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 18080
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 18080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: config
        configMap:
          name: clawork-config
      # 如果使用私有镜像仓库
      # imagePullSecrets:
      # - name: regcred

---
apiVersion: v1
kind: Service
metadata:
  name: clawork
  namespace: workany
  labels:
    app: clawork
spec:
  type: ClusterIP
  selector:
    app: clawork
  ports:
  - name: http
    port: 18080
    targetPort: 18080
    protocol: TCP
