apiVersion: v1
kind: ConfigMap
metadata:
  name: clawork-config
  namespace: workany
data:
  config.toml: |
    # Clawork 配置文件

    [server]
    port = 18080

    [database]
    # PostgreSQL 连接串
    # 格式: postgres://user:password@host:port/dbname?sslmode=disable
    dsn = "postgres://clawork:your-secure-password-here@postgres:5432/clawork?sslmode=disable"

    [k8s]
    # Bot Pod 部署的命名空间
    namespace = "workany"

    [openclaw]
    # OpenClaw 镜像
    image = "openclaw/openclaw:latest"
    # Gateway 端口
    gateway_port = 18789
    # 资源限制
    cpu_limit = "500m"
    memory_limit = "512Mi"
    cpu_request = "100m"
    memory_request = "128Mi"

    [storage]
    # 共享 PVC 名称
    pvc_name = "openclaw-shared-data"
    # 数据基础路径
    base_path = "/openclaw-data"

    [domain]
    # Bot 子域名后缀
    bot_domain_suffix = "workany.bot"
