apiVersion: v1
kind: ConfigMap
metadata:
  name: clawork-config
  namespace: workany
data:
  config.toml: |
    [server]
    port = 18080

    [db]
    host = "postgres"
    port = 5432
    user = "clawork"
    password = "your-secure-password"
    database = "clawork"
    sslmode = "disable"
    timezone = "Asia/Shanghai"

    [kubernetes]
    kubeconfig = ""
    namespace = "workany"
    local_dev = false

    [storage]
    pvc_name = "clawork-shared-data"
    base_path = "/openclaw-data"

    [domain]
    api_domain = "workany.ai"
    bot_domain_suffix = "workany.bot"
    bot_domain_template = "https://{bot_id}.workany.bot"

    [openclaw]
    image = "1panel/openclaw:latest"
    gateway_port = 18789
    cpu_limit = "1000m"
    memory_limit = "2Gi"
    cpu_request = "200m"
    memory_request = "512Mi"
