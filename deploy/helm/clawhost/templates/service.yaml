apiVersion: v1
kind: Service
metadata:
  name: {{ include "clawhost.fullname" . }}
  labels:
    {{- include "clawhost.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "clawhost.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
